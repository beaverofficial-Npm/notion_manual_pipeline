<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Windows/Office 한글 폰트가 컨테이너에 없으면 LibreOffice 가 임의 폰트로 대체해
  글자 폭·줄높이가 달라지고, 텍스트 상자가 넘쳐 옆/아래 요소와 겹친다.
  Noto Sans CJK 는 줄높이가 커서 세로 넘침을 유발하므로, 줄높이가 더 타이트한 Nanum 으로 매핑한다.
-->
<fontconfig>
  <!-- 맑은 고딕 / Malgun Gothic → NanumGothic (산세리프, 본문용) -->
  <match target="pattern">
    <test name="family"><string>맑은 고딕</string></test>
    <edit name="family" mode="assign" binding="strong"><string>NanumGothic</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Malgun Gothic</string></test>
    <edit name="family" mode="assign" binding="strong"><string>NanumGothic</string></edit>
  </match>

  <!-- 굴림/돋움(Gulim/Dotum) → NanumGothic -->
  <match target="pattern">
    <test name="family"><string>굴림</string></test>
    <edit name="family" mode="assign" binding="strong"><string>NanumGothic</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Gulim</string></test>
    <edit name="family" mode="assign" binding="strong"><string>NanumGothic</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>돋움</string></test>
    <edit name="family" mode="assign" binding="strong"><string>NanumGothic</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Dotum</string></test>
    <edit name="family" mode="assign" binding="strong"><string>NanumGothic</string></edit>
  </match>

  <!-- 바탕/궁서(Batang/Gungsuh) → NanumMyeongjo (세리프) -->
  <match target="pattern">
    <test name="family"><string>바탕</string></test>
    <edit name="family" mode="assign" binding="strong"><string>NanumMyeongjo</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Batang</string></test>
    <edit name="family" mode="assign" binding="strong"><string>NanumMyeongjo</string></edit>
  </match>
</fontconfig>
